[project]
name = "freelance-parser"
version = "0.1.0"
description = "Сбор заказов с фриланс-бирж и уведомления в Telegram"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
freelance-parser = "freelance_parser.main:run"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
